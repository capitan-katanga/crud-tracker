spring:
  application:
    name: crud-tracker
  mvc:
    problemdetails:
      enabled: true
    api-version:
      use:
        path-segment: 1
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      file: ../tracker-infra/compose.yaml   # infra compartida (Postgres, LGTM, Keycloak)
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: transactional
  datasource:
    url: jdbc:postgresql://localhost:5332/ExpenseTracker?currentSchema=transactional
    username: ${TRANSACTIONAL_DB_USERNAME:transactional}
    password: ${TRANSACTIONAL_DB_PASSWORD}
    hikari:   # pool fijo (ADR-013): el rol tiene CONNECTION LIMIT = pool + 2 en tracker-infra
      pool-name: transactional
      maximum-pool-size: ${TRANSACTIONAL_DB_POOL_SIZE:10}
      minimum-idle: ${TRANSACTIONAL_DB_POOL_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:300000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:30000}
  flyway:
    schemas: transactional
    default-schema: transactional
    create-schemas: false
    validate-migration-naming: true

springdoc:
  swagger-ui:
    operationsSorter: method
    docExpansion: none
    displayRequestDuration: true
  packages-to-scan:
    - com.expense.tracker.crudtracker.controller
    - com.expense.tracker.crudtracker.apidoc
  writer-with-default-pretty-printer: true
  show-actuator: true

server:
  port: 8080
