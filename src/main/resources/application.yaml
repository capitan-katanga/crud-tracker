spring:
  application:
    name: expense-ledger
  config:
    import: optional:file:.env[.properties]   # .env local gitignoreado (ver .env.example); las env vars exportadas lo pisan
  mvc:
    problemdetails:
      enabled: true
    api-version:
      use:
        path-segment: 1
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      file: ../tracker-infra/compose.yaml   # infra compartida (Postgres, LGTM, Keycloak)
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: expense_ledger
  datasource:
    url: ${EXPENSE_LEDGER_DB_URL}
    username: ${EXPENSE_LEDGER_DB_USERNAME}
    password: ${EXPENSE_LEDGER_DB_PASSWORD}
    hikari:   # pool fijo (ADR-013): el rol tiene CONNECTION LIMIT = pool + 2 en tracker-infra
      pool-name: expense-ledger
      maximum-pool-size: ${EXPENSE_LEDGER_DB_POOL_SIZE}
      minimum-idle: ${EXPENSE_LEDGER_DB_POOL_SIZE}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS}
  flyway:
    schemas: expense_ledger
    default-schema: expense_ledger
    create-schemas: false
    validate-migration-naming: true

springdoc:
  swagger-ui:
    operationsSorter: method
    docExpansion: none
    displayRequestDuration: true
  packages-to-scan:
    - com.expense.tracker.expenseledger.controller
    - com.expense.tracker.expenseledger.apidoc
  writer-with-default-pretty-printer: true
  show-actuator: true

server:
  port: 8083
