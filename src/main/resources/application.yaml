spring:
  application:
    name: crud-tracker
  mvc:
    problemdetails:
      enabled: true
    api-version:
      use:
        path-segment: 1
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      file: ../tracker-infra/compose.yaml   # infra compartida (Postgres, LGTM, Keycloak)
      lifecycle-management: start-only
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: transactional
  datasource:
    url: jdbc:postgresql://localhost:5332/ExpenseTracker?currentSchema=transactional
    username: ${TRANSACTIONAL_DB_USERNAME:transactional}
    password: ${TRANSACTIONAL_DB_PASSWORD}
  flyway:
    schemas: transactional
    default-schema: transactional
    create-schemas: false
    validate-migration-naming: true

springdoc:
  swagger-ui:
    operationsSorter: method
    docExpansion: none
    displayRequestDuration: true
  packages-to-scan:
    - com.expense.tracker.crudtracker.controller
    - com.expense.tracker.crudtracker.apidoc
  writer-with-default-pretty-printer: true
  show-actuator: true

server:
  port: 8080
